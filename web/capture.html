<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
  import { boot } from './js/boot.js';
  const c = document.getElementById('c');
  window.renderer = await boot(c);
  window.renderFrame = (t) => { window.renderer.render(t); };
  window.ready = true;
</script></body></html>
