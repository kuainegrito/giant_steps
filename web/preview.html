<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giant Steps Preview</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #05070f; --ink: #f3efe6; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Serif SC", serif; }
  canvas { width: 100%; max-width: 1280px; display: block; margin: 0 auto; aspect-ratio: 16 / 9; }
  .bar { max-width: 1280px; margin: 8px auto; padding: 0 16px; display: flex; gap: 12px; align-items: center; }
  input[type=range] { flex: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play">▶</button>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0">
  <span id="time">0.0</span>
</div>
<audio id="audio" src="../build/audio/mix.m4a" preload="auto"></audio>
<script type="module">
  import { boot } from './js/boot.js';
  const r = await boot(document.getElementById('c'));
  const seek = document.getElementById('seek'), audio = document.getElementById('audio');
  seek.max = r.duration;
  const draw = () => { const t = audio.paused ? +seek.value : audio.currentTime; r.render(t);
    if (!audio.paused) seek.value = t; document.getElementById('time').textContent = t.toFixed(1); requestAnimationFrame(draw); };
  seek.oninput = () => { audio.currentTime = +seek.value; };
  document.getElementById('play').onclick = () => (audio.paused ? audio.play() : audio.pause());
  const q = new URLSearchParams(location.search); if (q.has('t')) seek.value = q.get('t');
  window.__renderer = r;
  draw();
</script>
</body>
</html>
